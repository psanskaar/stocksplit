[package]
name = "stocksplit"
version = "0.1.0"
description = "StockSplit: Yield stripping for tokenized equities on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "stocksplit"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

# Suppress unexpected_cfgs warnings from anchor 0.29 macros (they emit cfg(anchor_debug))
[lints.rust]
unexpected_cfgs = { level = "allow" }

[dependencies]
anchor-lang = { version = "0.29.0", features = ["init-if-needed"] }
# default-features = false excludes confidential_transfer which overflows BPF 4096-byte stack limit
anchor-spl = { version = "0.29.0", default-features = false, features = ["token", "token_2022", "associated_token"] }
spl-token-2022 = { version = "0.9", default-features = false, features = ["no-entrypoint"] }
